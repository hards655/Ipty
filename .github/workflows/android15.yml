name: Android 15 boot test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install Android 15 SDK image
        run: |
          python -m py_compile lab.py
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd -n dm1q_api35_lab -k "system-images;android-35;google_apis;x86_64"
      - name: Boot and verify Android
        run: |
          mkdir -p results
          "$ANDROID_HOME/emulator/emulator" -avd dm1q_api35_lab -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >results/emulator.log 2>&1 &
          trap 'adb -s emulator-5554 emu kill || true' EXIT
          timeout 300 adb -s emulator-5554 wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              break
            fi
            sleep 5
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb -s emulator-5554 shell input keyevent 82
          python lab.py configure --serial emulator-5554 | tee results/active-settings.txt
          adb -s emulator-5554 shell getprop >results/actual-properties.txt
          python lab.py compare --serial emulator-5554 | tee results/comparison.txt
          adb -s emulator-5554 exec-out screencap -p >results/screen.png
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-boot-results
          path: results/
          if-no-files-found: warn
